name: terraform-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - modules/key-policy
          - modules/replica
          - examples/minimal
          - examples/complete
          - examples/multi-region
          - examples/asymmetric-signing
          - examples/multiple-keys
    uses: hatan4ik/terraform-pipelines/.github/workflows/terraform-quality.yml@838da070a7e33ed2911ad3768ba3d00cccc9a5d9 # v0.1.0
    with:
      working_directory: ${{ matrix.directory }}
      check_docs: true
