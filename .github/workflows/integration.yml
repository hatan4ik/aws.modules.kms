name: integration

# Real-account integration suites. Dispatch only; never on pull requests. The
# account and region come from the protected `integration` environment, so the
# workflow itself stays universal. See tests/integration/README.md.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run.
        required: true
        default: smoke
        type: choice
        options:
          - smoke

permissions:
  contents: read
  id-token: write

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-24.04
    environment: integration
    timeout-minutes: 45
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Assume the integration role through OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_INTEGRATION_ROLE_ARN }}
          role-session-name: aws-modules-ksm-integration
          aws-region: ${{ vars.AWS_INTEGRATION_REGION }}

      - name: Initialize without a remote backend
        run: terraform init -backend=false -input=false -test-directory=tests/integration -no-color

      - name: Run the ${{ inputs.suite }} suite
        run: terraform test -test-directory=tests/integration -filter="tests/integration/${{ inputs.suite }}.tftest.hcl" -no-color
